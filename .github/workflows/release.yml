name: CI/CD

on:
  push:
    branches: [main, v2api, "release/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Build SDK
        run: pnpm build

      - name: Typecheck SDK
        run: pnpm typecheck

      - name: Test SDK
        run: pnpm test

      - name: Build docs
        run: pnpm docs:build

  publish-dev:
    name: Publish dev releases
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref_type == 'branch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2api')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build

      - name: Set dev version
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          BASE_VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
          if [ "$GITHUB_REF_NAME" = "v2api" ]; then
            DIST_TAG=v2-dev
          else
            DIST_TAG=dev
          fi
          echo "Setting @rool-dev/sdk to ${DEV_VERSION} with dist-tag ${DIST_TAG}"
          echo "DIST_TAG=${DIST_TAG}" >> "$GITHUB_ENV"
          npm version "${DEV_VERSION}" --no-git-tag-version

      - name: Publish SDK (dev)
        run: npm publish --tag "$DIST_TAG" --access public

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) doesn't match $PKG_NAME version ($PKG_VERSION)"
            exit 1
          fi
          echo "✓ $PKG_NAME: $PKG_VERSION"

      # A backport release (e.g. v0.11.16 published after v0.12.0) must not
      # move the `latest` dist-tag backwards, so only tag `latest` when the
      # version exceeds what npm currently serves.
      - name: Determine npm dist-tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT=$(npm view @rool-dev/sdk version 2>/dev/null || echo "0.0.0")
          NEWER=$(node -e "
            const p = (v) => v.split('.').map(Number);
            const a = p('$TAG_VERSION'), b = p('$CURRENT');
            console.log(a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2]);
          ")
          if [ "$NEWER" = "true" ]; then DIST_TAG=latest; else DIST_TAG=maintenance; fi
          echo "Publishing ${TAG_VERSION} with dist-tag '${DIST_TAG}' (npm latest is ${CURRENT})"
          echo "DIST_TAG=${DIST_TAG}" >> "$GITHUB_ENV"

      - name: Publish SDK
        run: npm publish --access public --tag "$DIST_TAG"
